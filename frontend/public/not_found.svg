<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Glowing Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ground Shadow under Floating Objects -->
  <ellipse cx="250" cy="400" rx="100" ry="12" fill="#000000" fill-opacity="0.2" filter="url(#glowEffect)" />

  <!-- Floating Main Elements Wrapper (with slight translate for floating style) -->
  <g transform="translate(0, -10)" filter="url(#shadowEffect)">
    
    <!-- 404 Large Glow Text -->
    <text x="250" y="150" font-family="'Inter', -apple-system, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#purpleGrad)" letter-spacing="-2" filter="url(#glowEffect)">
      404
    </text>

    <!-- Empty Clipboard / Todo List (Themed for TodoX) -->
    <g transform="translate(175, 170)">
      <!-- Board Shadow -->
      <rect x="5" y="5" width="140" height="180" rx="12" fill="#000000" fill-opacity="0.15" />
      
      <!-- Board body (glassmorphism look) -->
      <rect x="0" y="0" width="140" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
      
      <!-- Clipboard Top Metal Piece -->
      <rect x="45" y="-10" width="50" height="20" rx="4" fill="url(#cyanGrad)" />
      <circle cx="70" cy="-5" r="3" fill="#ffffff" />

      <!-- Empty Dotted Guidelines (Representing tasks that aren't there) -->
      <!-- Item 1 -->
      <circle cx="25" cy="40" r="6" fill="none" stroke="#64748b" stroke-width="2" />
      <line x1="45" y1="40" x2="115" y2="40" stroke="#475569" stroke-width="3" stroke-linecap="round" />
      
      <!-- Item 2 -->
      <circle cx="25" cy="80" r="6" fill="none" stroke="#64748b" stroke-width="2" />
      <line x1="45" y1="80" x2="105" y2="80" stroke="#475569" stroke-width="3" stroke-linecap="round" />

      <!-- Item 3 -->
      <circle cx="25" cy="120" r="6" fill="none" stroke="#64748b" stroke-width="2" />
      <line x1="45" y1="120" x2="95" y2="120" stroke="#475569" stroke-width="3" stroke-linecap="round" />

      <!-- Giant Question Mark (?) Overlaying List -->
      <g transform="translate(100, 110)" filter="url(#glowEffect)">
        <circle cx="15" cy="15" r="28" fill="url(#pinkGrad)" />
        <text x="15" y="25" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
      </g>
    </g>

    <!-- Floating Magnifying Glass searching for task -->
    <g transform="translate(100, 240)">
      <!-- Handle -->
      <line x1="50" y1="50" x2="80" y2="80" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Glass Rim -->
      <circle cx="25" cy="25" r="32" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="5" />
      <!-- Inner lens highlight -->
      <circle cx="25" cy="25" r="27" fill="#22d3ee" fill-opacity="0.1" />
      <path d="M 10,12 A 20,20 0 0,1 30,8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />
    </g>

    <!-- Floating Sparkles / Stars -->
    <path d="M 90,80 L 93,90 L 103,93 L 93,96 L 90,106 L 87,96 L 77,93 L 87,90 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 390,120 L 392,125 L 397,127 L 392,129 L 390,134 L 388,129 L 383,127 L 388,125 Z" fill="#fb7185" opacity="0.8" />
    <path d="M 350,280 L 354,290 L 364,294 L 354,298 L 350,308 L 346,298 L 336,294 L 346,290 Z" fill="#c084fc" opacity="0.6" />
  </g>

  <!-- Typography for Message (Bottom) -->
  <text x="250" y="435" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#f1f5f9">
    Oops! Task Not Found
  </text>
  <text x="250" y="458" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#64748b" letter-spacing="0.5">
    The page you are looking for might have been deleted or moved.
  </text>
</svg>
