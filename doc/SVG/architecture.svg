<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Node/Database Gradient -->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.015" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Architecture Title -->
  <text x="40" y="45" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">
    TodoX <tspan font-weight="300" fill="#94a3b8">| System Architecture</tspan>
  </text>

  <!-- ==================== FRONTEND COLUMN (LEFT) ==================== -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <!-- Column Header -->
    <rect width="200" height="340" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect width="200" height="40" rx="12" fill="#1e1b4b" opacity="0.4" />
    <text x="100" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle" letter-spacing="1">CLIENT (React)</text>

    <!-- Component 1: UI View -->
    <g transform="translate(15, 60)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">UI Components</text>
      <text x="20" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#64748b">shadcn/ui + Tailwind v4</text>
    </g>

    <!-- Component 2: State Management -->
    <g transform="translate(15, 140)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">React State</text>
      <text x="20" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#64748b">Tasks &amp; Filters State</text>
    </g>

    <!-- Component 3: API Client -->
    <g transform="translate(15, 220)">
      <rect width="170" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="20" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#3b82f6">Fetch API Service</text>
      <text x="20" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#64748b">HTTP client for REST API</text>
    </g>

    <!-- Dev Environment badge -->
    <rect x="15" y="300" width="170" height="25" rx="6" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-dasharray="2,2" />
    <text x="100" y="316" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">Vite Dev Server (Port 5173)</text>
  </g>

  <!-- ==================== BACKEND COLUMN (CENTER) ==================== -->
  <g transform="translate(300, 80)" filter="url(#shadow)">
    <!-- Column Header -->
    <rect width="220" height="340" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect width="220" height="40" rx="12" fill="#581c87" opacity="0.15" />
    <text x="110" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle" letter-spacing="1">SERVER (Express)</text>

    <!-- Component 1: Routes -->
    <g transform="translate(15, 60)">
      <rect width="190" height="55" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="15" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">taskRouters.js</text>
      <text x="15" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#94a3b8">/api/tasks/* Router</text>
    </g>

    <!-- Component 2: Controllers -->
    <g transform="translate(15, 130)">
      <rect width="190" height="55" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="15" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">taskController.js</text>
      <text x="15" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#94a3b8">Business logic, Query handling</text>
    </g>

    <!-- Component 3: Models -->
    <g transform="translate(15, 200)">
      <rect width="190" height="55" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="15" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">taskModel.js</text>
      <text x="15" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#94a3b8">Mongoose Schema (MDB Model)</text>
    </g>

    <!-- Config / DNS -->
    <g transform="translate(15, 265)">
      <rect width="190" height="40" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="15" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#71717a">db.js (Google DNS config)</text>
    </g>

    <!-- Dev Environment badge -->
    <rect x="15" y="310" width="190" height="20" rx="4" fill="#a855f7" fill-opacity="0.1" stroke="#a855f7" stroke-dasharray="2,2" />
    <text x="110" y="323" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#c084fc" text-anchor="middle">Node --watch (Port 5001)</text>
  </g>

  <!-- ==================== DATABASE COLUMN (RIGHT) ==================== -->
  <g transform="translate(580, 80)" filter="url(#shadow)">
    <!-- Column Header -->
    <rect width="180" height="340" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    <rect width="180" height="40" rx="12" fill="#064e3b" opacity="0.2" />
    <text x="90" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">DATABASE</text>

    <!-- MongoDB Database Cylinder -->
    <g transform="translate(25, 80)">
      <!-- Cylinder top -->
      <ellipse cx="65" cy="40" rx="55" ry="18" fill="url(#dbGrad)" stroke="#10b981" stroke-width="1" />
      <!-- Cylinder body -->
      <path d="M 10,40 L 10,130 A 55,18 0 0,0 120,130 L 120,40 Z" fill="url(#dbGrad)" opacity="0.85" stroke="#10b981" stroke-width="1" />
      <!-- Middle ring lines -->
      <path d="M 10,70 A 55,18 0 0,0 120,70" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="3,3" />
      <path d="M 10,100 A 55,18 0 0,0 120,100" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="3,3" />
      <!-- Text inside DB -->
      <text x="65" y="85" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">MongoDB</text>
      <text x="65" y="103" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Atlas Cloud</text>
    </g>

    <!-- DB Stats collection info -->
    <g transform="translate(15, 230)">
      <rect width="150" height="55" rx="6" fill="#064e3b" fill-opacity="0.1" stroke="#047857" stroke-width="1" />
      <text x="15" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">Collection: tasks</text>
      <text x="15" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="9" fill="#6ee7b7">Schema structured documents</text>
    </g>

    <!-- Env Info -->
    <rect x="15" y="300" width="150" height="25" rx="6" fill="#10b981" fill-opacity="0.05" stroke="#047857" stroke-dasharray="2,2" />
    <text x="90" y="316" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">SECURE .env CONFIG</text>
  </g>

  <!-- ==================== FLOW ARROWS & LABELS ==================== -->
  
  <!-- Client to Server Request Arrow (Top) -->
  <path d="M 240,160 Q 270,150 300,160" fill="none" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)" />
  <text x="270" y="145" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">JSON request</text>

  <!-- Server to Client Response Arrow (Bottom) -->
  <path d="M 300,320 Q 270,330 240,320" fill="none" stroke="url(#arrowGrad)" stroke-width="2.5" />
  <!-- Left-facing arrow tip manual design -->
  <path d="M 240,320 L 246,316 M 240,320 L 246,324" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
  <text x="270" y="344" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">HTTP Response</text>

  <!-- Server Model to MongoDB Atlas Connection -->
  <path d="M 520,290 C 545,290 545,260 580,260" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Arrow tip for DB -->
  <path d="M 580,260 L 574,256 M 580,260 L 574,264" fill="none" stroke="#10b981" stroke-width="2" />
  <text x="550" y="282" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">Mongoose</text>
</svg>
