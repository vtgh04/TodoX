<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" /> <!-- Violet -->
      <stop offset="50%" stop-color="#ec4899" /> <!-- Pink -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue -->
    </linearGradient>

    <!-- Secondary Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="400" cy="130" r="110" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  <circle cx="480" cy="160" r="90" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Tech Grid Overlay (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
  </g>

  <!-- Tech Lines and Nodes -->
  <path d="M 50,150 L 150,150 L 180,120 L 250,120" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="250" cy="120" r="3" fill="#ec4899" />
  
  <path d="M 750,150 L 650,150 L 620,180 L 550,180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="550" cy="180" r="3" fill="#3b82f6" />

  <!-- Logo Icon: Futuristic "X" Checkbox -->
  <g transform="translate(375, 45)">
    <!-- Outer hexagonal / diamond border -->
    <polygon points="25,0 50,25 25,50 0,25" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#textGlow)" />
    <!-- Inner checkbox check -->
    <path d="M 15,25 L 22,32 L 35,16" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Title -->
  <text x="400" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="4">
    TODO<tspan fill="url(#primaryGrad)">X</tspan>
  </text>

  <!-- Subtitle -->
  <text x="400" y="200" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#9ca3af" letter-spacing="6">
    F U L L S T A C K   M E R N   A P P L I C A T I O N
  </text>

  <!-- Badges / Tech Tags -->
  <g transform="translate(160, 240)">
    <!-- MongoDB -->
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="50" y="17" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">MONGODB</text>

    <!-- Express -->
    <rect x="120" y="0" width="100" height="26" rx="6" fill="#f3f4f6" fill-opacity="0.1" stroke="#9ca3af" stroke-width="1" />
    <text x="170" y="17" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e5e7eb" text-anchor="middle">EXPRESS</text>

    <!-- React -->
    <rect x="240" y="0" width="100" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="290" y="17" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle">REACT</text>

    <!-- Node.js -->
    <rect x="360" y="0" width="100" height="26" rx="6" fill="#84cc16" fill-opacity="0.15" stroke="#84cc16" stroke-width="1" />
    <text x="410" y="17" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a3e635" text-anchor="middle">NODE.JS</text>
  </g>
</svg>
